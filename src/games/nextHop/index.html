// ---------- randomness: world generation can be seeded (daily packet), effects never are ----------
function mulberry32(a) {
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = Math.random;
const seedRng = s => { rnd = s == null ? Math.random : mulberry32(s >>> 0); };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const chance = p => rnd() < p;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fr = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- IPv4 as unsigned 32-bit ints ----------
const ip = (a, b, c, d) => ((a << 24) | (b << 16) | (c << 8) | d) >>> 0;
const octets = n => [n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
const ipStr = n => octets(n).join('.');
const mask = (n, len) => len === 0 ? 0 : (n & (~0 << (32 - len))) >>> 0;
const inNet = (addr, net, len) => mask(addr, len) === net;
const cidr = (net, len) => ipStr(net) + '/' + len;
const POOLS = [
  () => ip(10, ri(0, 255), ri(0, 255), ri(1, 254)),
  () => ip(172, ri(16, 31), ri(0, 255), ri(1, 254)),
  () => ip(192, 168, ri(0, 255), ri(1, 254)),
  () => ip(203, 0, 113, ri(1, 254)),
  () => ip(198, 51, 100, ri(1, 254)),
];
const randomIp = () => pick(POOLS)();

  const d = { unlocked: 0, stars: {}, endlessBest: 0, daily: {}, settings: Object.assign({}, DEFAULT_SETTINGS) };
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s && typeof s === 'object') {
      Object.assign(d, s);
      d.settings = Object.assign({}, DEFAULT_SETTINGS, s.settings);
    }
  } catch (e) { /* no storage: progress lasts for this visit only */ }
  return d;
})();

// ---------- sound: tiny WebAudio synth, no files ----------
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

const Snd = {
  ctx: null, sfx: null, mus: null, noiseBuf: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    this.sfx = c.createGain(); this.sfx.connect(c.destination);
    this.mus = c.createGain(); this.mus.connect(c.destination);
    this.noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.apply();
    Music.start();
  },
  apply() {
    if (!this.ctx) return;
    this.sfx.gain.value = save.settings.sfx ? 1 : 0;
    this.mus.gain.value = save.settings.music ? 0.5 : 0;
  },
  tone(f0, f1, dur, type = 'square', vol = 0.06, delay = 0, at = null, dest = null) {
    const c = this.ctx; if (!c) return;
    const t0 = at != null ? at : c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || this.sfx);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol = 0.12, at = null, dest = null, hp = 0) {
    const c = this.ctx; if (!c) return;
    const t0 = at != null ? at : c.currentTime;
    const s = c.createBufferSource(), g = c.createGain();
    s.buffer = this.noiseBuf;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = s;
    if (hp) { const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; s.connect(f); node = f; }
    node.connect(g); g.connect(dest || this.sfx);
    s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02);
  },
};

  { bpm: 112, prog: [0, -4, -7, -5], minor: true, arp: [0, 2, 1, 3, 2, 1, 4, 2] },   // 0 menus
  { bpm: 126, prog: [0, 0, -4, -2], minor: true, arp: [0, 1, 2, 3, 2, 1, 2, 4] },    // 1 routing

  { bpm: 124, prog: [0, 5, 3, -2], minor: false, arp: [0, 1, 2, 1, 3, 2, 4, 2] },    // 3 dns
  { bpm: 136, prog: [0, -4, 3, -2], minor: true, arp: [0, 2, 1, 2, 3, 2, 4, 2] },    // 4 switching
  { bpm: 128, prog: [0, 3, 5, 3], minor: true, arp: [0, 1, 2, 3, 4, 3, 2, 1] },      // 5 nat
  { bpm: 120, prog: [0, -5, -3, -7], minor: false, arp: [0, 2, 1, 3, 2, 4, 3, 1] },  // 6 mtu
  { bpm: 140, prog: [0, -2, -4, -2], minor: true, arp: [0, 1, 2, 1, 3, 1, 4, 1] },   // 7 load & qos
  { bpm: 148, prog: [0, 1, -2, -4], minor: true, arp: [0, 3, 1, 4, 2, 3, 1, 2] },    // 8 under attack
  { bpm: 138, prog: [0, -4, -2, -7], minor: true, arp: [0, 2, 4, 2, 3, 1, 2, 4] },   // 9 endless
];
const LEAD = [0, -1, 2, -1, 4, -1, 3, 2, -1, -1, 1, -1, 0, -1, -1, -1]; // chord-tone index per step, -1 = rest

const Music = {
  theme: 0, step: 0, next: 0, timer: null,
  start() { if (!this.timer) this.timer = setInterval(() => this.pump(), 30); },
  play(i) { if (this.theme === i) return; this.theme = i; this.step = 0; },
  pump() {
    const c = Snd.ctx;
    if (!c || !save.settings.music) return;
    const th = THEMES[this.theme], dt = 60 / th.bpm / 4;
    if (this.next < c.currentTime) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.15) { this.note(th, this.step++, this.next, dt); this.next += dt; }
  },
  note(th, s, t, dt) {
    const i = s % 16, bar = Math.floor(s / 16);
    const root = 45 + th.prog[bar % th.prog.length];
    const chord = th.minor ? [0, 3, 7, 12, 15] : [0, 4, 7, 12, 16];
    const m = Snd.mus;
    if (i % 2 === 0) { const f = mtof(root - 12 + (i % 8 === 6 ? 12 : 0)); Snd.tone(f, f, dt * 1.7, 'triangle', 0.15, 0, t, m); }
    const a = mtof(root + 12 + chord[th.arp[i % th.arp.length]]);
    Snd.tone(a, a, dt * 0.8, 'square', 0.022, 0, t, m);
    if (i % 4 === 0) Snd.tone(150, 40, 0.12, 'sine', 0.22, 0, t, m);
    if (i % 4 === 2) Snd.noise(0.04, 0.05, t, m, 6000);
    if (bar % 4 >= 2 && LEAD[i] >= 0) { const f = mtof(root + 24 + chord[LEAD[i]]); Snd.tone(f, f, dt * 1.6, 'square', 0.03, 0, t, m); }
  },
};

// ---------- network vocabulary ----------
const SERVICES = [
  { name: 'HTTP', proto: 'TCP', port: 80 }, { name: 'HTTPS', proto: 'TCP', port: 443 },
  { name: 'SSH', proto: 'TCP', port: 22 }, { name: 'DNS', proto: 'UDP', port: 53 },
  { name: 'SMTP', proto: 'TCP', port: 25 }, { name: 'NTP', proto: 'UDP', port: 123 },
  { name: 'RDP', proto: 'TCP', port: 3389 }, { name: 'MySQL', proto: 'TCP', port: 3306 },
  { name: 'IMAPS', proto: 'TCP', port: 993 }, { name: 'SIP', proto: 'UDP', port: 5060 },
  { name: 'SNMP', proto: 'UDP', port: 161 }, { name: 'Syslog', proto: 'UDP', port: 514 },
];
const HOSTS = ['shop', 'mail', 'api', 'cdn', 'vpn', 'git', 'wiki', 'chat', 'play', 'news', 'docs', 'pay'];
const DOMAINS = ['example.com', 'example.net', 'example.org'];
const QOS = [
  { name: 'VOICE', dscp: 'EF' }, { name: 'VIDEO', dscp: 'AF41' }, { name: 'DATA', dscp: 'AF21' },
  { name: 'BACKUP', dscp: 'CS1' }, { name: 'WEB', dscp: 'BE' },
];
const VLANS = [10, 20, 30, 40, 50, 99];
const VLAN_COL = { 10: '#ff8a3d', 20: '#3dd16b', 30: '#4e8dff', 40: '#ff5cf0', 50: '#ffc24e', 99: '#c8c8c8' };
const MTUS = [
  { mtu: 576, sub: 'old serial link' }, { mtu: 1280, sub: 'IPv6 minimum' }, { mtu: 1400, sub: 'VPN tunnel' },
  { mtu: 1500, sub: 'Ethernet' }, { mtu: 4470, sub: 'backbone link' }, { mtu: 9000, sub: 'jumbo frames' },
  { mtu: 9216, sub: 'data center' },
];
const PUBLIC_PORTS = [8080, 8443, 2222, 5000, 9000, 25565];

function lookalike(host) {
  const [name, ...rest] = host.split('.');
  const subs = [['o', '0'], ['l', '1'], ['i', '1'], ['m', 'rn'], ['e', '3'], ['a', '4']].filter(([a]) => name.includes(a));
  if (subs.length) { const [a, b] = pick(subs); return [name.replace(a, b), ...rest].join('.'); }
  return host.replace('.example.', '.examp1e.');
}

// ---------- the packet ----------
function makePacket(f = {}) {
  const p = { ip: randomIp(), svc: pick(SERVICES), fields: f };
  if (f.vlan) p.vlan = pick(VLANS);
  if (f.host) p.host = pick(HOSTS) + '.' + pick(DOMAINS);
  if (f.size) p.size = f.size === 'any' ? pick([1500, 4000, 9000]) : f.size;
  if (f.cls) p.cls = pick(QOS);
  if (f.nat) {
    p.pub = { ip: ip(203, 0, 113, ri(2, 250)), port: pick(PUBLIC_PORTS) };
    p.priv = { ip: ip(192, 168, ri(0, 30), ri(2, 250)), port: p.svc.port };
  }
  return p;
}
// what the header shows when the packet sets off; DNS and NAT racks change it on the way
function startView(p) {
  const f = p.fields;
  return {
    dst: p.host ? null : (p.pub ? p.pub.ip : p.ip), host: p.host || null,
    proto: p.svc.proto, port: p.pub ? p.pub.port : p.svc.port, svc: p.pub ? null : p.svc.name,
    showPort: !!(f.svc || f.nat), showSvc: !f.hideSvc,
    vlan: p.vlan || null, size: p.size || 0, cls: p.cls || null,
  };
}

// ---------- racks: each returns ports {label, sub, ok, down, why}; ok ports are the right way through ----------
function nearMiss(addr, len) { // same length, close to the real network, never contains addr
  if (len % 8 === 0) {
    const o = octets(addr), k = len / 8 - 1;
    let v; do { v = ri(0, 255); } while (v === o[k]);
    o[k] = v;
    return mask(ip(...o), len);
  }
  const b = ri(Math.max(0, len - 8), len - 1);
  return mask((addr ^ (1 << (31 - b))) >>> 0, len);
}
function farMiss(addr, len) {
  for (let i = 0; i < 40; i++) { const n = mask(randomIp(), len); if (!inNet(addr, n, len)) return n; }
  return nearMiss(addr, len);
}

// tier 1 unrelated nets, 2 look-alikes, 3 overlapping + default route, 4 + dead links, 5 + any prefix length, 6 BGP/RPKI
function genRouter(v, tier) {
  const dst = v.ip;
  const lens = tier >= 5 ? [8, 12, 16, 20, 22, 24, 28] : [8, 16, 24];
  const k = tier <= 2 ? 2 : 3;
  const cl = tier === 6 ? pick([8, 12, 16, 20, 24]) : tier >= 3 && chance(0.18) ? 0 : pick(lens);
  const ports = [{ net: mask(dst, cl), len: cl, ok: true }];
  if (tier === 6) {
    const hl = pick([16, 20, 24, 28].filter(l => l > cl));
    ports.push({ net: mask(dst, hl), len: hl, hijack: true });
  } else if (tier >= 4 && chance(0.4)) {
    const dl = pick([16, 20, 24, 32].filter(l => l > cl));
    ports.push({ net: mask(dst, dl), len: dl, down: true });
  }
  for (let guard = 0; ports.length < k && guard < 60; guard++) {
    let r;
    const shorter = [0, 8, 12, 16].filter(l => l < cl && (tier >= 5 || l % 8 === 0));
    if (tier >= 3 && shorter.length && !ports.some(x => x.less) && chance(0.6)) {
      const l = pick(shorter);
      r = { net: mask(dst, l), len: l, less: true };
    } else {
      const l = cl === 0 || chance(0.3) ? pick(lens) : cl;
      r = { net: tier === 1 ? farMiss(dst, l) : nearMiss(dst, l), len: l };
    }
    if (!ports.some(x => x.net === r.net && x.len === r.len)) ports.push(r);
  }
  const good = ports[0];
  for (const p of ports) {
    p.label = cidr(p.net, p.len);
    if (tier === 6) p.sub = p.hijack ? 'AS64666 · RPKI invalid' : 'AS' + ri(64500, 64511) + ' · RPKI valid';
  }
  for (const p of ports) {
    if (p.ok || p.down) continue;
    p.why = p.hijack ? `${p.label} is a hijack: RPKI marks it invalid. ${good.label} was right.`
      : p.less ? `${p.label} matches, but ${good.label} is longer. Longest prefix wins.`
      : `${p.label} doesn't contain ${ipStr(dst)}. ${good.label} was right.`;
  }
  return { kind: tier === 6 ? 'bgp' : 'router', unit: 'router', title: tier === 6 ? 'BGP' : 'ROUTER', ports: shuffle(ports) };
}

// tier 1 numbers with names, 2 + DENY and wrong protocol, 3 names only, 4 port ranges
function genFirewall(v, tier) {
  const s = v.svc, other = s.proto === 'TCP' ? 'UDP' : 'TCP';
  const byName = tier === 3;
  const fmt = (act, x) => byName ? `${act} ${x.name}` : `${act} ${x.proto} ${x.port}`;
  const ports = [];
  if (tier === 4) {
    const lo = Math.max(1, s.port - ri(5, 60)), hi = s.port + ri(5, 60);
    const lo2 = hi + 1, hi2 = hi + ri(20, 400);
    ports.push({ label: `ALLOW ${s.proto} ${lo}-${hi}`, ok: true });
    ports.push({ label: `ALLOW ${s.proto} ${lo2}-${hi2}`, why: `Port ${s.port} is not in ${lo2}-${hi2}.` });
    ports.push({ label: `ALLOW ${other} ${lo}-${hi}`, why: `Right ports, wrong protocol: you are ${s.proto}.` });
  } else {
    const o = pick(SERVICES.filter(x => x.port !== s.port));
    ports.push({ label: fmt('ALLOW', s), sub: tier === 1 ? s.name : null, ok: true });
    ports.push({ label: fmt('ALLOW', o), sub: tier === 1 ? o.name : null, why: `That rule allows ${o.name} (${o.proto} ${o.port}). You are ${s.proto} ${s.port}.` });
    if (tier >= 2) {
      if (byName || chance(0.5)) ports.push({ label: fmt('DENY', s), why: `A DENY rule for ${s.name} drops your packet.` });
      else ports.push({ label: `ALLOW ${other} ${s.port}`, why: `Right port, wrong protocol: you are ${s.proto}.` });
    }
  }
  return { kind: 'firewall', unit: 'firewall', title: 'FIREWALL', ports: shuffle(ports) };
}

// tier 1 other names, 2 + look-alike, 3 DNSSEC
function genDns(v, tier) {
  const h = v.host, addr = v.ip, other = () => ipStr(randomIp());
  const ports = [];
  if (tier >= 3) {
    const la = lookalike(h);
    ports.push({ label: h, sub: `A ${ipStr(addr)} · DNSSEC ok`, ok: true });
    ports.push({ label: h, sub: `A ${other()} · DNSSEC bogus`, why: 'Forged answer: its DNSSEC signature failed. Trust only validated answers.' });
    ports.push({ label: la, sub: `A ${other()} · DNSSEC ok`, why: `Look-alike name: ${la} is not ${h}.` });
  } else {
    let oh; do { oh = pick(HOSTS) + '.' + pick(DOMAINS); } while (oh === h);
    ports.push({ label: h, sub: 'A ' + ipStr(addr), ok: true });
    ports.push({ label: oh, sub: 'A ' + other(), why: `That record is for ${oh}. You asked for ${h}.` });
    if (tier === 2) { const la = lookalike(h); ports.push({ label: la, sub: 'A ' + other(), why: `Look-alike name: ${la} is not ${h}.` }); }
  }
  return {
    kind: 'dns', unit: 'dns', title: 'DNS', ports: shuffle(ports),
    effect: cur => { cur.dst = addr; notify(`Resolved ${h} to ${ipStr(addr)}.`, C.green); },
  };
}

// tier 1 access ports, 2 + trunks
function genSwitch(v, tier) {
  const vl = v.vlan, others = VLANS.filter(x => x !== vl);
  const ports = [];
  if (tier >= 2 && chance(0.5)) {
    const set = shuffle(others.slice()).slice(0, 2).concat(vl).sort((a, b) => a - b);
    ports.push({ label: 'TRUNK ' + set.join(','), ok: true });
  } else ports.push({ label: 'ACCESS VLAN ' + vl, ok: true });
  const o1 = pick(others);
  ports.push({ label: 'ACCESS VLAN ' + o1, why: `An access port carries only its own VLAN, ${o1}. You are VLAN ${vl}.` });
  if (tier >= 2) {
    const set = shuffle(others.filter(x => x !== o1)).slice(0, 2).sort((a, b) => a - b);
    ports.push({ label: 'TRUNK ' + set.join(','), why: `That trunk carries VLANs ${set.join(' and ')}, not ${vl}.` });
  }
  return { kind: 'switch', unit: 'switch', title: 'SWITCH', ports: shuffle(ports) };
}

// tier 1 other public port, 2 + other public address
function genNat(v, tier, p) {
  const { pub, priv } = p;
  const fake = () => `-> ${ipStr(ip(192, 168, ri(0, 30), ri(2, 250)))}:${pick(SERVICES).port}`;
  const op = pick(PUBLIC_PORTS.filter(x => x !== pub.port));
  const ports = [
    { label: `${ipStr(pub.ip)}:${pub.port}`, sub: `-> ${ipStr(priv.ip)}:${priv.port}`, ok: true },
    { label: `${ipStr(pub.ip)}:${op}`, sub: fake(), why: `That forward is for port ${op}. You arrived on port ${pub.port}.` },
  ];
  if (tier >= 2) {
    let oi; do { oi = ip(203, 0, 113, ri(2, 250)); } while (oi === pub.ip);
    ports.push({ label: `${ipStr(oi)}:${pub.port}`, sub: fake(), why: `That forward is for ${ipStr(oi)}. You were sent to ${ipStr(pub.ip)}.` });
  }
  return {
    kind: 'nat', unit: 'nat', title: 'NAT', ports: shuffle(ports),
    effect: cur => {
      cur.dst = priv.ip; cur.port = priv.port; cur.svc = p.svc.name;
      notify(`NAT rewrote your destination to ${ipStr(priv.ip)}:${priv.port}.`, C.green);
    },
  };
}

// tier 1 with link names, 2 numbers only
function genMtu(v, tier) {
  const size = v.size;
  const g = pick(MTUS.filter(m => m.mtu >= size));
  const small = shuffle(MTUS.filter(m => m.mtu < size)).slice(0, tier === 1 ? 1 : 2);
  const ports = [{ label: 'MTU ' + g.mtu, sub: tier === 1 ? g.sub : null, ok: true }];
  small.forEach(m => ports.push({ label: 'MTU ' + m.mtu, sub: tier === 1 ? m.sub : null, why: `MTU ${m.mtu} is smaller than your ${size} bytes, and Don't Fragment is set.` }));
  return { kind: 'mtu', unit: 'router', title: 'MTU', ports: shuffle(ports) };
}

// tier 1 least connections, 2 + a server that is down
function genLb(v, tier) {
  const names = shuffle(['web-1', 'web-2', 'web-3', 'app-a', 'app-b', 'app-c']).slice(0, 3);
  const conns = shuffle([ri(1, 6), ri(9, 16), ri(18, 40)]);
  const ports = names.map((n, i) => ({ label: n, conn: conns[i] }));
  if (tier >= 2) {
    const d = pick(ports);
    d.down = true; d.sub = 'DOWN: health check failed';
    d.downTitle = 'SERVER DOWN'; d.downText = 'That server failed its health check. Pick a healthy one.';
  }
  const up = ports.filter(p => !p.down);
  const good = up.reduce((a, p) => p.conn < a.conn ? p : a);
  for (const p of ports) {
    if (p.down) continue;
    p.sub = `healthy · ${p.conn} conn`;
    if (p === good) p.ok = true;
    else p.why = `${p.label} has ${p.conn} connections, ${good.label} only ${good.conn}. Least connections wins.`;
  }
  return { kind: 'lb', unit: 'lb', title: 'LOAD BAL', ports: shuffle(ports) };
}

// tier 1 queue names, 2 DSCP codes only
function genQos(v, tier) {
  const c = v.cls;
  const opts = [c, ...shuffle(QOS.filter(q => q !== c)).slice(0, 2)];
  const ports = opts.map(q => ({
    label: 'DSCP ' + q.dscp, sub: tier === 1 ? q.name.toLowerCase() + ' queue' : null, ok: q === c,
    why: q === c ? '' : `${c.name} traffic is marked ${c.dscp}. ${q.dscp} is the ${q.name.toLowerCase()} queue.`,
  }));
  return { kind: 'qos', unit: 'switch', title: 'QoS', ports: shuffle(ports) };
}

const GEN = { router: genRouter, firewall: genFirewall, dns: genDns, switch: genSwitch, nat: genNat, mtu: genMtu, lb: genLb, qos: genQos };

function buildRacks(p, plan) {
  const v = { ip: p.pub ? p.pub.ip : p.ip, svc: p.svc, vlan: p.vlan, size: p.size, cls: p.cls, host: p.host };
  return plan.map(([kind, tier]) => {
    const r = GEN[kind](v, tier, p);
    if (kind === 'nat') v.ip = p.priv.ip;
    return r;
  });
}

// ---------- one run: campaign level, endless, daily, or the title screen playing itself ----------
const S = {
  mode: 'attract', gi: 0, phase: 'ready', t: 0, score: 0, autopilot: false,
  racks: [], hazards: [], pickups: [], zones: [], servers: [], segments: [], seg: 0, cur: null,
  particles: [], popups: [], notices: [],
  px: PX, py: 300, vy: 0, readyY: 300, invuln: 0, shield: 0, shake: 0,
  camX: 0, speed: 3, bgScroll: 0, floorScroll: 0, genX: 0,
  ttl: 0, ttlMax: 0, streak: 0, misroutes: 0, hits: 0, delivered: 0,
  deadT: 0, deathTitle: '', deathText: '', delivT: 0, bonus: 0, stars: 0, newBest: false,
};
const assistK = () => save.settings.assist ? 0.85 : 1;
const dayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const daySeed = () => Math.imul(parseInt(dayKey().replace(/-/g, ''), 10), 2654435761 | 0) >>> 0;
const pktScale = () => { const z = S.cur ? S.cur.size : 0; return z >= 9000 ? 1.4 : z >= 4000 ? 1.2 : 1; };

function newRun(mode, gi = 0) {
  S.mode = mode; S.gi = gi; S.score = 0; S.delivered = 0;
  seedRng(mode === 'daily' ? daySeed() : null);
  S.camX = 0; S.racks = []; S.hazards = []; S.pickups = []; S.zones = []; S.servers = []; S.segments = []; S.seg = 0;
  S.particles = []; S.popups = []; S.notices = [];
  S.px = PX; S.py = S.readyY = (TOP + FLOOR) / 2; S.vy = 0; S.invuln = 0; S.shield = 0; S.shake = 0;
  S.streak = 0; S.misroutes = 0; S.hits = 0; S.deadT = 0; S.delivT = 0; S.newBest = false;
  S.phase = 'ready'; S.t = 0; S.autopilot = mode === 'attract';
  S.genX = W + 140;
  if (mode === 'campaign') {
    const L = LEVELS[gi];
    addSegment(L.pkt, L.plan(), L.hz, (3.0 + 0.045 * gi) * assistK(), gi);
  } else {
    addEndlessSegment(); addEndlessSegment();
  }
  enterSegment(0);
  if (mode === 'attract') S.phase = 'playing';
}

function enterSegment(i) {
  const seg = S.segments[i];
  S.seg = i; S.cur = seg.cur; S.ttl = S.ttlMax = seg.ttlMax; S.speed = seg.speed;
}

function layoutPorts(ports, gi) {
  const k = ports.length, span = FLOOR - TOP, minWall = 16;
  const fit = Math.floor((span - (k + 1) * minWall) / k);
  let gh = (200 - 1.2 * gi) * (save.settings.assist ? 1.15 : 1) - (k === 3 ? 10 : 0);
  gh = Math.min(Math.round(gh), fit);
  const slack = span - k * gh - (k + 1) * minWall;
  const w = Array.from({ length: k + 1 }, () => rnd() + 0.15), sum = w.reduce((a, b) => a + b, 0);
  let y = TOP;
  ports.forEach((p, i) => {
    y += minWall + slack * w[i] / sum;
    p.top = Math.round(y); p.bot = Math.round(y + gh); p.result = null;
    y += gh;
  });
}
const goalPort = r => r.ports.find(q => q.ok && !q.down) || r.ports.find(q => !q.down) || r.ports[0];
const goalY = r => { const p = goalPort(r); return (p.top + p.bot) / 2; };

function addSegment(pf, plan, hz, speed, gi) {
  const p = makePacket(pf);
  const racks = buildRacks(p, plan);
  const spacing = Math.round(speed * 136); // the same reaction time at every speed
  const seg = {
    idx: S.segments.length, p, cur: startView(p), speed,
    ttlMax: racks.filter(r => r.kind !== 'switch').length + 3 + (save.settings.assist ? 3 : 0),
  };
  let x = S.genX, prev = null;
  for (const r of racks) {
    layoutPorts(r.ports, gi);
    r.x = x; r.seg = seg.idx; r.passed = false;
    S.racks.push(r);
    if (prev) fillGap(prev.x + PW, x, goalY(prev), goalY(r), hz);
    prev = r; x += spacing;
  }
  seg.serverX = prev.x + PW + Math.round(spacing * 0.6);
  S.servers.push({ x: seg.serverX, seg: seg.idx, done: false });
  S.genX = seg.serverX + 96 + Math.round(spacing * 0.7);
  S.segments.push(seg);
  return seg;
}

function addEndlessSegment() {
  const n = S.segments.length;
  const name = n === 0 ? 'routing' : pick(endlessPacks());
  const t = Math.min(5, 1 + Math.floor(n / 2));
  const { pkt, plan } = ENDLESS_PACKS[name](t);
  const hz = {
    virus: Math.min(0.6, 0.25 + 0.04 * n), spark: n > 1 ? Math.min(0.4, 0.05 * n) : 0,
    sniffer: n > 3 ? 0.15 : 0, shield: 0.2, bots: n > 5 ? 0.2 : 0,
    congestion: n > 2 ? 0.12 : 0, jitter: n > 4 ? 0.1 : 0,
  };
  addSegment(pkt, plan, hz, Math.min(3.2 + 0.12 * n, 5.2) * assistK(), Math.min(39, 4 + n * 3));
}

// hazards and pickups between two racks; ACKs sit on the right path
function fillGap(a, b, y0, y1, hz) {
  const at = f => y0 + (y1 - y0) * f, mid = (a + b) / 2;
  if (hz.congestion && chance(hz.congestion)) S.zones.push({ kind: 'congestion', x0: a + 30, x1: b - 30 });
  else if (hz.jitter && chance(hz.jitter)) S.zones.push({ kind: 'jitter', x0: a + 20, x1: b - 160 });
  const virus = chance(hz.virus || 0);
  if (chance(hz.ack == null ? 0.55 : hz.ack)) {
    [0.25, 0.5, 0.75].forEach(f => { if (!(virus && f === 0.5)) S.pickups.push({ kind: 'ack', x: a + (b - a) * f, y: at(f), ph: rnd() * 6 }); });
  } else if (hz.shield && chance(hz.shield)) S.pickups.push({ kind: 'shield', x: a + (b - a) * 0.3, y: at(0.3), ph: 0 });
  if (virus) {
    const base = clamp(at(0.5) + pick([-1, 1]) * ri(40, 90), TOP + 40, FLOOR - 40);
    S.hazards.push({ kind: 'virus', x: mid, baseY: base, y: base, amp: ri(40, 70), ph: rnd() * 6, r: 15 });
  }
  if (hz.spark && chance(hz.spark)) {
    const base = clamp(at(0.6) + ri(-60, 60), TOP + 40, FLOOR - 40);
    S.hazards.push({ kind: 'spark', x: b - 30, baseY: base, y: base, ph: rnd() * 6, r: 14, vx: -2.4, live: false });
  }
  if (hz.sniffer && chance(hz.sniffer)) {
    S.hazards.push({ kind: 'sniffer', x: b - 10, y: clamp(at(0.4) + pick([-1, 1]) * ri(90, 150), TOP + 40, FLOOR - 40), r: 14, live: false });
  }
  if (hz.bots && chance(hz.bots)) {
    const by = clamp(at(0.5) + ri(-70, 70), TOP + 70, FLOOR - 70), n = ri(4, 6);
    for (let i = 0; i < n; i++) S.hazards.push({ kind: 'bot', x: b + 40 + i * 46, baseY: by + (i % 2 ? 34 : -34), y: by, ph: i, r: 13, vx: -1.8, live: false });
  }
}

// ---------- effects ----------
function popup(text, col, x = S.px, y = S.py - 34) { S.popups.push({ text, col, x, y, life: 60 }); }
function notify(text, col) { if (S.mode !== 'attract' && text) S.notices.push({ text, col, life: 200 }); }
function burst(x, y, col, n = 24) {
  for (let i = 0; i < n; i++) {
    const a = fr(0, Math.PI * 2), s = fr(1, 6);
    S.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 40 + fr(0, 20), ch: Math.random() < 0.5 ? '0' : '1', col });
  }
}

function flap() {
  if (S.phase === 'ready') S.phase = 'playing';
  if (S.phase !== 'playing') return;
  S.vy = FLAP;
  gsfx('flap');
  for (let i = 0; i < 3; i++) S.particles.push({ x: S.px - 18, y: S.py + fr(-8, 8), vx: fr(-3.5, -1.5), vy: fr(-0.6, 0.6), life: 30, ch: Math.random() < 0.5 ? '0' : '1', col: C.cyan });
}

function die(title, text) {
  if (S.phase !== 'playing') return;
  S.phase = 'dead'; S.deadT = 0; S.deathTitle = title; S.deathText = text;
  S.shake = 14; burst(S.px, S.py, C.red, 40); gsfx('die');
  if (S.mode === 'endless' && S.score > save.endlessBest) { save.endlessBest = S.score; S.newBest = true; persist(); }
  if (S.mode === 'daily') { const k = dayKey(); if (S.score > (save.daily[k] || 0)) { save.daily[k] = S.score; S.newBest = true; persist(); } }
  UIfocus = 0;
}

const HAZARD_NAME = { virus: 'CRC ERROR', spark: 'COLLISION', sniffer: 'SNIFFED', bot: 'DDoS HIT' };
function hurt(kind) {
  if (S.invuln > 0) return;
  if (S.shield) {
    S.shield = 0; S.invuln = 40;
    popup('TLS BLOCKED IT', C.blue); gsfx('block');
    return;
  }
  S.ttl -= 2; S.invuln = 90; S.shake = 8; S.streak = 0; S.hits++;
  popup(HAZARD_NAME[kind] + '  -2 TTL', C.red); gsfx('hit');
  if (S.ttl <= 0) die('TTL EXCEEDED', 'TTL hit 0, so a router discarded the packet (ICMP Time Exceeded).');
}

const PASS_WORDS = {
  router: ['ROUTED', 'MISROUTED'], bgp: ['ROUTED', 'HIJACKED'], firewall: ['ALLOWED', 'BLOCKED'],
  dns: ['RESOLVED', 'SPOOFED'], switch: ['SWITCHED', 'WRONG VLAN'], nat: ['TRANSLATED', 'NO SUCH FORWARD'],
  mtu: ['FITS', 'TOO BIG'], lb: ['BALANCED', 'OVERLOADED'], qos: ['QUEUED', 'WRONG QUEUE'],
};
function portAt(r, y) {
  return r.ports.find(p => y >= p.top - 6 && y <= p.bot + 6) ||
    r.ports.reduce((a, p) => Math.abs((p.top + p.bot) / 2 - y) < Math.abs((a.top + a.bot) / 2 - y) ? p : a);
}
function passRack(r) {
  r.passed = true;
  const p = portAt(r, S.py), words = PASS_WORDS[r.kind], l2 = r.kind === 'switch';
  if (p.ok) {
    p.result = 'ok'; S.streak++;
    const pts = 100 + 20 * (S.streak - 1);
    S.score += pts;
    if (!l2) S.ttl -= 1;
    popup(words[0] + ' +' + pts, C.green); gsfx('good');
  } else {
    p.result = 'bad';
    r.ports.forEach(q => { if (q.ok) q.result = 'should'; });
    S.streak = 0; S.misroutes++; S.ttl -= l2 ? 2 : 3; S.shake = 6;
    popup(words[1] + (l2 ? '  -2 TTL' : '  -3 TTL'), C.red); gsfx('bad');
    notify(p.why, C.red);
  }
  if (r.effect) r.effect(S.segments[r.seg].cur);
  if (S.ttl <= 0) die('TTL EXCEEDED', 'TTL hit 0, so a router discarded the packet (ICMP Time Exceeded).');
}

function deliver() {
  S.phase = 'delivered'; S.delivT = 0; S.delivered++;
  S.bonus = 500 + S.ttl * 100; S.score += S.bonus;
  S.stars = 1 + (S.misroutes === 0 ? 1 : 0) + (S.hits === 0 ? 1 : 0);
  const k = String(S.gi);
  save.stars[k] = Math.max(save.stars[k] || 0, S.stars);
  save.unlocked = Math.max(save.unlocked, Math.min(LAST_LEVEL, S.gi + 1));
  persist();
  UIfocus = 0;
}

function checkpoint() {
  const bonus = 300 + S.ttl * 50;
  S.score += bonus; S.delivered++;
  popup('DELIVERED +' + bonus, C.green, S.px, S.py - 60);
  gsfx('checkpoint');
  enterSegment(S.seg + 1);
  S.misroutes = 0; S.hits = 0;
  addEndlessSegment();
  notify(S.cur.dst != null ? `New packet for ${ipStr(S.cur.dst)}.` : `New packet for ${S.cur.host}. Resolve it first.`, C.cyan);
}

// ---------- the title screen's pilot (also used for screenshots) ----------
function autopilot() {
  const r = S.racks.find(q => q.x - S.camX + PW > S.px - 16);
  const ty = r ? goalY(r) + 12 : (TOP + FLOOR) / 2;
  if (S.py > ty && S.vy >= 0) S.vy = FLAP;
}

// ---------- update ----------
function updateFx() {
  for (const p of S.particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--; }
  S.particles = S.particles.filter(p => p.life > 0);
  for (const p of S.popups) { p.y -= 0.7; p.life--; }
  S.popups = S.popups.filter(p => p.life > 0);
  if (S.notices.length && --S.notices[0].life <= 0) S.notices.shift();
  if (S.notices.length > 3) S.notices.splice(0, S.notices.length - 3);
}

function updateRun() {
  S.t++;
  S.shake *= 0.86;
  updateFx();
  switch (S.phase) {
    case 'ready':
      S.py = S.readyY + Math.sin(S.t * 0.1) * 6; S.bgScroll += 0.3;
      break;
    case 'playing': updatePlaying(); break;
    case 'dead':
      S.deadT++;
      if (S.py < FLOOR - 14) { S.vy = Math.min(S.vy + G, VMAX); S.py = Math.min(S.py + S.vy, FLOOR - 14); }
      break;
    case 'delivered': {
      S.delivT++;
      const sx = S.servers[0].x - S.camX;
      if (S.delivT < 45) { S.px += (sx + 48 - S.px) * 0.08; S.py += (FLOOR - 120 - S.py) * 0.08; }
      if (S.delivT === 45) { burst(sx + 48, FLOOR - 120, C.green, 40); gsfx('deliver'); }
      break;
    }
  }
}

function updatePlaying() {
  if (S.invuln > 0) S.invuln--;
  const sc = pktScale();
  let g = G;
  for (const z of S.zones) {
    if (S.px > z.x0 - S.camX && S.px < z.x1 - S.camX) {
      if (z.kind === 'congestion') g *= 1.45;
      else if (S.t % 9 === 0) S.vy += fr(-1.4, 1.4);
    }
  }
  if (S.autopilot) autopilot();
  S.vy = Math.min(S.vy + g, VMAX);
  S.py += S.vy;
  if (S.py < TOP + 14) { S.py = TOP + 14; S.vy = Math.max(S.vy, 0); }
  S.camX += S.speed; S.bgScroll += S.speed * 0.2; S.floorScroll += S.speed;

  if (S.py + 8 * sc >= FLOOR) return die('PACKET DROPPED', 'It fell into the cable tray. Keep flapping.');

  const hw = 24 * sc, hh = 16 * sc, hx = S.px - hw / 2, hy = S.py - hh / 2;
  for (const r of S.racks) {
    const sx = r.x - S.camX;
    if (sx > W || sx + PW < -40) continue;
    if (hx + hw > sx && hx < sx + PW) {
      const gap = r.ports.find(p => hy > p.top && hy + hh < p.bot);
      if (!gap) return die('PACKET DROPPED', `It hit a ${r.title} rack. Fly through a port.`);
      if (gap.down) return die(gap.downTitle || 'LINK DOWN', gap.downText || 'That link is down. Take the next longest matching route.');
    }
    if (!r.passed && S.px > sx + PW / 2) { passRack(r); if (S.phase !== 'playing') return; }
  }

  for (const h of S.hazards) {
    if (h.dead) continue;
    if (!h.live && h.x - S.camX < W + 30) h.live = true;
    if (h.kind === 'virus') h.y = h.baseY + Math.sin(S.t * 0.045 + h.ph) * h.amp;
    else if (h.kind === 'spark') { if (h.live) h.x += h.vx; h.y = h.baseY + Math.sin(S.t * 0.15 + h.ph) * 18; }
    else if (h.kind === 'bot') { if (h.live) h.x += h.vx; h.y = h.baseY + Math.sin(S.t * 0.08 + h.ph) * 14; }
    else if (h.kind === 'sniffer' && h.live && h.x - S.camX > S.px - 30) { h.x -= 0.9; h.y += clamp(S.py - h.y, -1.3, 1.3); }
    const sx = h.x - S.camX;
    if (sx < -80) { h.dead = true; continue; }
    if (Math.hypot(sx - S.px, h.y - S.py) < h.r + 11 * sc) {
      h.dead = true;
      burst(sx, h.y, h.kind === 'spark' ? C.amber : h.kind === 'bot' ? C.green : C.red, 16);
      hurt(h.kind);
      if (S.phase !== 'playing') return;
    }
  }

  for (const a of S.pickups) {
    if (a.got) continue;
    if (Math.hypot(a.x - S.camX - S.px, a.y - S.py) < 14 + 11 * sc) {
      a.got = true;
      if (a.kind === 'shield') { S.shield = 1; popup('TLS SHIELD', C.blue); gsfx('shield'); continue; }
      S.score += 25;
      if (S.ttl < S.ttlMax) { S.ttl++; popup('ACK  +1 TTL', C.amber); } else popup('ACK  +25', C.amber);
      gsfx('ack');
    }
  }

  for (const sv of S.servers) {
    if (sv.done || sv.seg !== S.seg || S.px < sv.x - S.camX + 20) continue;
    sv.done = true;
    if (S.mode === 'campaign') return deliver();
    checkpoint();
  }

  if (S.mode !== 'campaign') { // drop what scrolled away
    const gone = S.camX - 300;
    S.racks = S.racks.filter(r => r.x + PW > gone);
    S.hazards = S.hazards.filter(h => !h.dead);
    S.pickups = S.pickups.filter(a => !a.got && a.x > gone);
    S.zones = S.zones.filter(z => z.x1 > gone);
    S.servers = S.servers.filter(s => s.x + 96 > gone);
  }
}

// ---------- drawing helpers ----------
function txt(s, x, y, font, col, align = 'center', base = 'middle') {
  ctx.font = font; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.fillText(s, x, y);
}
const textW = (s, font) => { ctx.font = font; return ctx.measureText(s).width; };
function panel(x, y, w, h, stroke = 'rgba(78,242,255,0.35)') {
  ctx.fillStyle = C.panel; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}
function sprite(name, sx, sy, sw, sh, dx, dy, dw, dh) {
  const im = IMG[name];
  if (im) ctx.drawImage(im, sx, sy, sw, sh, dx, dy, dw, dh);
  else { ctx.fillStyle = C.magenta; ctx.fillRect(dx, dy, dw, dh); }
}
function drawUnit(name, x, y, w = PW, h = UNIT) {
  const rc = UNIT_RECT[name];
  const uw = Math.min(w, Math.round(rc[2] * h / rc[3]));
  sprite(name, rc[0], rc[1], rc[2], rc[3], x + (w - uw) / 2, y, uw, h);
}
// returns the y below the last line
function wrapText(s, x, y, maxW, lh, font, col, align = 'center') {
  ctx.font = font;
  let line = '', yy = y;
  for (const w of s.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { txt(line, x, yy, font, col, align); line = w; yy += lh; ctx.font = font; }
    else line = test;
  }
  if (line) txt(line, x, yy, font, col, align);
  return yy + lh;
}
function drawStar(cx, cy, r, filled) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = filled ? C.amber : 'rgba(108,122,166,0.25)'; ctx.fill();
  ctx.strokeStyle = filled ? '#7a4d00' : 'rgba(108,122,166,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
}

// ---------- world ----------
function drawBG(scroll) {
  const off = ((scroll % 1920) + 1920) % 1920;
  for (let i = -1; i < 3; i++) {
    const x = Math.floor(i * 960 - off);
    if (x > W || x + 960 < 0) continue;
    if (!IMG.bg) { ctx.fillStyle = '#0a0d24'; ctx.fillRect(x, 0, 960, H); continue; }
    if (((i % 2) + 2) % 2 === 0) ctx.drawImage(IMG.bg, x, 28, 960, 540);
    else { ctx.save(); ctx.translate(x + 960, 28); ctx.scale(-1, 1); ctx.drawImage(IMG.bg, 0, 0, 960, 540); ctx.restore(); }
  }
  ctx.fillStyle = '#0a0d24'; ctx.fillRect(0, 0, W, 28);
  ctx.fillStyle = 'rgba(5,6,15,0.5)'; ctx.fillRect(0, 0, W, H);
}

function drawFloor(scroll) {
  ctx.fillStyle = '#0a0d1f'; ctx.fillRect(0, FLOOR, W, H - FLOOR);
  ctx.fillStyle = C.cyan; ctx.globalAlpha = 0.6; ctx.fillRect(0, FLOOR, W, 2); ctx.globalAlpha = 1;
  ctx.lineWidth = 2;
  [[FLOOR + 6, '#ff8a3d', 22], [FLOOR + 11, '#3dd16b', 30]].forEach(([y, col, d]) => {
    ctx.strokeStyle = col; ctx.setLineDash([d, 10]); ctx.lineDashOffset = scroll;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  });
  ctx.setLineDash([]);
}

function drawWall(x, y0, y1, seed, unit) {
  if (y1 - y0 <= 0) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y0, PW, y1 - y0); ctx.clip();
  ctx.fillStyle = C.rack; ctx.fillRect(x, y0, PW, y1 - y0);
  let n = 0;
  for (let y = y1 - UNIT; y > y0 - UNIT; y -= UNIT, n++) {
    drawUnit(unit, x, y);
    const ph = ((T >> 3) + n * 3 + seed * 7) % 6;
    if (ph < 3) { ctx.fillStyle = ph === 2 ? C.amber : C.green; ctx.fillRect(x + PW - 17 + (ph % 2) * 5, y + 7, 3, 3); }
  }
  ctx.fillStyle = C.rail; ctx.fillRect(x, y0, 3, y1 - y0); ctx.fillRect(x + PW - 3, y0, 3, y1 - y0);
  ctx.restore();
}

function portColor(p) {
  if (p.down) return C.red;
  if (p.result === 'ok' || p.result === 'should') return C.green;
  if (p.result === 'bad') return C.red;
  return C.cyan;
}

function drawRack(r) {
  const sx = Math.round(r.x - S.camX);
  if (sx > W + 140 || sx + PW < -140) return;
  let y = TOP;
  r.ports.forEach((p, i) => { drawWall(sx, y, p.top, i + Math.floor(r.x / 7), r.unit); y = p.bot; });
  drawWall(sx, y, FLOOR, 9 + Math.floor(r.x / 7), r.unit);
  // rack name at the top
  const tw = textW(r.title, '7px ' + FD) + 10;
  ctx.fillStyle = 'rgba(5,6,15,0.85)'; ctx.fillRect(sx + PW / 2 - tw / 2, TOP + 2, tw, 13);
  txt(r.title, sx + PW / 2, TOP + 9, '7px ' + FD, C.dim);

  for (const p of r.ports) {
    const cy = (p.top + p.bot) / 2, col = portColor(p), mx = sx + PW / 2;
    ctx.save();
    ctx.shadowColor = col; ctx.shadowBlur = 10; ctx.fillStyle = col;
    ctx.fillRect(sx - 4, p.top - 3, PW + 8, 3); ctx.fillRect(sx - 4, p.bot, PW + 8, 3);
    ctx.restore();
    let ly = cy;
    if (p.down) {
      ctx.strokeStyle = C.red; ctx.lineWidth = 2;
      for (let yy = p.top + 10; yy < p.bot - 6; yy += 14) {
        ctx.globalAlpha = 0.35 + 0.4 * Math.abs(Math.sin(T * 0.2 + yy));
        ctx.beginPath(); ctx.moveTo(sx, yy); ctx.lineTo(sx + PW, yy); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      if (r.kind !== 'lb') { sprite('broken', 0, 0, 32, 32, mx - 24, cy - 52, 48, 48); ly = cy + 16; }
    }
    const lf = '800 16px ' + FM, sf = '500 12px ' + FM;
    const w = Math.max(textW(p.label, lf), p.sub ? textW(p.sub, sf) : 0) + 18;
    const h = p.sub ? 40 : 24;
    ctx.fillStyle = 'rgba(5,6,15,0.88)'; ctx.fillRect(mx - w / 2, ly - h / 2, w, h);
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(mx - w / 2 + 1, ly - h / 2 + 1, w - 2, h - 2);
    const tc = p.result ? col : p.down ? C.red : C.ink;
    if (p.sub) {
      txt(p.label, mx, ly - 8, lf, tc);
      txt(p.sub, mx, ly + 10, sf, p.down ? C.red : C.dim);
    } else txt(p.label, mx, ly + 1, lf, tc);
    if (p.down && r.kind !== 'lb') { ctx.fillStyle = C.red; ctx.fillRect(mx - w / 2 + 6, ly, w - 12, 2); }
  }
}

function drawZones() {
  for (const z of S.zones) {
    const x0 = z.x0 - S.camX, x1 = z.x1 - S.camX;
    if (x1 < 0 || x0 > W) continue;
    const jit = z.kind === 'jitter', col = jit ? C.amber : C.magenta;
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, TOP, x1 - x0, FLOOR - TOP); ctx.clip();
    ctx.fillStyle = jit ? 'rgba(255,194,78,0.06)' : 'rgba(255,92,240,0.08)'; ctx.fillRect(x0, TOP, x1 - x0, FLOOR - TOP);
    ctx.strokeStyle = jit ? 'rgba(255,194,78,0.16)' : 'rgba(255,92,240,0.18)'; ctx.lineWidth = jit ? 3 : 10;
    if (jit) {
      for (let y = TOP + 10; y < FLOOR; y += 22) {
        ctx.beginPath();
        for (let x = x0; x <= x1; x += 12) ctx.lineTo(x, y + ((x / 12 + (T >> 2)) % 2 ? 5 : -5));
        ctx.stroke();
      }
    } else {
      for (let k = -600; k < x1 - x0 + 600; k += 36) {
        ctx.beginPath(); ctx.moveTo(x0 + k + (T % 36), TOP); ctx.lineTo(x0 + k - 400 + (T % 36), FLOOR); ctx.stroke();
      }
    }
    ctx.restore();
    txt(jit ? 'JITTER' : 'CONGESTION', (x0 + x1) / 2, TOP + 26, '9px ' + FD, col);
    txt(jit ? 'shaky link' : 'heavy packet', (x0 + x1) / 2, TOP + 42, '500 12px ' + FM, col);
  }
}

function drawHazards() {
  for (const h of S.hazards) {
    if (h.dead) continue;
    const sx = h.x - S.camX;
    if (sx < -60 || sx > W + 60) continue;
    if (h.kind === 'virus') sprite('virus', 2, 5, 28, 22, sx - 28 + ((T >> 2) % 2), h.y - 22, 56, 44);
    else if (h.kind === 'spark') {
      ctx.save(); ctx.translate(sx, h.y); ctx.rotate(Math.sin(T * 0.4) * 0.3);
      sprite('spark', 0, 0, 32, 32, -32, -32, 64, 64);
      ctx.restore();
    } else if (h.kind === 'sniffer') sprite('sniffer', 2, 4, 28, 22, sx - 28, h.y - 22 + Math.sin(T * 0.2) * 2, 56, 44);
    else if (h.kind === 'bot') sprite('bot', 3, 3, 26, 27, sx - 20, h.y - 20, 39, 40);
  }
}

function drawPickups() {
  for (const a of S.pickups) {
    if (a.got) continue;
    const sx = a.x - S.camX;
    if (sx < -40 || sx > W + 40) continue;
    const bob = Math.sin(T * 0.08 + a.ph) * 4;
    sprite(a.kind === 'shield' ? 'shield' : 'ack', 0, 0, 32, 32, sx - 24, a.y - 24 + bob, 48, 48);
  }
}

function drawServers() {
  for (const sv of S.servers) {
    const sx = Math.round(sv.x - S.camX);
    if (sx > W + 40 || sx < -140) continue;
    const seg = S.segments[sv.seg];
    ctx.save(); ctx.globalAlpha = 0.4 + 0.3 * Math.sin(T * 0.1); ctx.fillStyle = C.green;
    ctx.fillRect(sx + 40, TOP, 16, FLOOR - 176 - TOP); ctx.restore();
    sprite('server', 7, 4, 48, 88, sx, FLOOR - 176, 96, 176);
    const label = seg.cur.dst != null ? 'DST ' + ipStr(seg.cur.dst) : 'DST ' + seg.cur.host;
    const w = textW(label, '800 16px ' + FM) + 20;
    panel(sx + 48 - w / 2, FLOOR - 218, w, 28, C.green);
    txt(label, sx + 48, FLOOR - 203, '800 16px ' + FM, C.green);
  }
}

function drawPacket() {
  if (S.phase === 'delivered' && S.delivT > 45) return;
  if (S.invuln > 0 && (S.invuln >> 2) % 2 && S.phase === 'playing') return;
  const sc = pktScale();
  ctx.globalAlpha = S.phase === 'dead' ? Math.max(0, 1 - S.deadT / 30) : 1;
  const ang = S.phase === 'playing' || S.phase === 'dead' ? clamp(S.vy * 0.06, -0.45, 1.1) : 0;
  const s = sc * (S.phase === 'delivered' ? Math.max(0.2, 1 - S.delivT / 50) : 1);
  ctx.save(); ctx.translate(S.px, S.py); ctx.rotate(ang); ctx.scale(s, s);
  sprite('packet', 0, 0, 32, 32, -32, -33, 64, 64);
  ctx.restore();
  if (S.shield && S.phase === 'playing') {
    ctx.strokeStyle = C.blue; ctx.lineWidth = 2; ctx.globalAlpha = 0.5 + 0.3 * Math.sin(T * 0.2);
    ctx.beginPath(); ctx.arc(S.px, S.py, 30 * sc, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if ((S.phase === 'playing' || S.phase === 'ready') && S.mode !== 'attract' && S.cur) {
    const tag = S.cur.dst != null ? '>' + ipStr(S.cur.dst) : '>' + S.cur.host;
    ctx.globalAlpha = 0.75; txt(tag, S.px, S.py - 36 * sc, '500 12px ' + FM, C.green); ctx.globalAlpha = 1;
  }
}

function drawFx() {
  for (const p of S.particles) { ctx.globalAlpha = clamp(p.life / 30, 0, 1); txt(p.ch, p.x, p.y, '800 13px ' + FM, p.col); }
  ctx.globalAlpha = 1;
  for (const p of S.popups) {
    ctx.globalAlpha = clamp(p.life / 30, 0, 1);
    txt(p.text, p.x + 1, p.y + 1, '10px ' + FD, '#000');
    txt(p.text, p.x, p.y, '10px ' + FD, p.col);
  }
  ctx.globalAlpha = 1;
}

function drawWorld() {
  ctx.save();
  if (S.shake > 0.5 && save.settings.shake) ctx.translate(fr(-1, 1) * S.shake * 0.5, fr(-1, 1) * S.shake * 0.5);
  drawBG(S.bgScroll);
  drawZones();
  S.racks.forEach(drawRack);
  drawServers(); drawHazards(); drawPickups();
  drawFloor(S.floorScroll);
  drawPacket(); drawFx();
  ctx.restore();
}

// ---------- HUD: the top bar reads like the packet's header, the bottom bar is the trip ----------
function headerFields() {
  const c = S.cur, f = [];
  if (c.dst != null) f.push({ k: 'DST', v: ipStr(c.dst), col: C.green, big: true });
  else f.push({ k: 'DST', v: c.host + ' -> ?', col: C.amber, big: true });
  if (c.host && c.dst != null) f.push({ k: 'HOST', v: c.host });
  if (c.showPort) f.push({ k: 'PORT', v: `${c.proto} ${c.port}` + (c.showSvc && c.svc ? ' ' + c.svc : '') });
  if (c.vlan) f.push({ k: 'VLAN', v: String(c.vlan), col: VLAN_COL[c.vlan] });
  if (c.size) f.push({ k: 'SIZE', v: c.size + ' B  DF' });
  if (c.cls) f.push({ k: 'CLASS', v: c.cls.name });
  return f;
}

// ---------- menus: buttons are rebuilt every frame; mouse, touch and keys all go through them ----------
let T = 0;            // frames since start, for blinking and animation
let scr = 'boot';     // title | campaign | manual | settings | game | ending
let UI = [], UIfocus = 0, paused = false, pickCh = -1, manSel = 0, resetArm = false;

function go(s) {
  scr = s; UIfocus = 0; pickCh = -1; resetArm = false; paused = false;
  if (s === 'title') { newRun('attract'); Music.play(0); }
  else if (s !== 'game') Music.play(0);
}

function button(x, y, w, h, label, action, o = {}) {
  const f = UI.length === UIfocus;
  UI.push({ x, y, w, h, action, disabled: !!o.disabled });
  ctx.fillStyle = f ? 'rgba(78,242,255,0.16)' : 'rgba(8,11,28,0.88)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = f ? C.cyan : 'rgba(108,122,166,0.45)'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  if (o.draw) { o.draw(x, y, w, h, f); return; }
  const col = o.disabled ? C.dim : o.col || (f ? C.cyan : C.ink);
  const font = o.font || '11px ' + FD;
  if (o.sub) { txt(label, x + w / 2, y + h / 2 - 8, font, col); txt(o.sub, x + w / 2, y + h / 2 + 11, '500 12px ' + FM, o.subCol || C.dim); }
  else txt(label, x + w / 2, y + h / 2 + 1, font, col);
}
function activate(i) {
  const b = UI[i];
  if (!b) return;
  if (b.disabled) { sfx('deny'); return; }
  sfx('select'); b.action();
}
function navigate(dx, dy) {
  const cur = UI[UIfocus];
  if (!cur) { UIfocus = 0; return; }
  const cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2;
  let best = -1, bd = 1e9;
  UI.forEach((b, i) => {
    if (i === UIfocus) return;
    const vx = b.x + b.w / 2 - cx, vy = b.y + b.h / 2 - cy;
    const along = dx ? vx * dx : vy * dy;
    if (along <= 4) return;
    const d = along + (dx ? Math.abs(vy) : Math.abs(vx)) * 2;
    if (d < bd) { bd = d; best = i; }
  });
  if (best >= 0) { UIfocus = best; sfx('move'); }
}
function back() {
  if (scr === 'campaign' && pickCh >= 0) { pickCh = -1; UIfocus = 0; return; }
  if (scr === 'game') { togglePause(); return; }
  if (scr !== 'title') go('title');
}

function packetSummary(c) {
  const bits = [];
  if (c.showPort) bits.push(`${c.proto} ${c.port}` + (c.showSvc && c.svc ? ' ' + c.svc : ''));
  if (c.vlan) bits.push('VLAN ' + c.vlan);
  if (c.size) bits.push(c.size + ' bytes, DF');
  if (c.cls) bits.push(c.cls.name + ' traffic');
  return bits.join('  ·  ');
}

// ---------- loop ----------
let frozen = false; // screenshot mode stops time
function tick() {
  T++;
  if (frozen) return;
  if (scr === 'title') { updateRun(); if (S.phase === 'dead' && S.deadT > 60) newRun('attract'); }
  else if (scr === 'game' && !paused) updateRun();
}

function render() {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.imageSmoothingEnabled = false;
  UI = [];
  if (scr === 'boot') {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    txt('LOADING...', W / 2, H / 2, '14px ' + FD, C.cyan);
    return;
  }
    ({ title: drawTitle, campaign: drawCampaign, manual: drawManual, settings: drawSettings,
      game: drawGame, ending: drawEnding })[scr]();
  if (UIfocus >= UI.length) UIfocus = Math.max(0, UI.length - 1);
}

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(now - last, 250); last = now;
  while (acc >= STEP) { tick(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}

// ---------- sizing: fill the window, keep 16:10 ----------
function resize() {
  const s = Math.max(0.1, Math.min(window.innerWidth / W, window.innerHeight / H));
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
}
window.addEventListener('resize', resize);

// ---------- input ----------
const toGame = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
const hitUI = (x, y) => UI.findIndex(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
const inFlight = () => scr === 'game' && !paused && (S.phase === 'ready' || S.phase === 'playing');

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); cv.focus(); Snd.init();
  const [x, y] = toGame(e), i = hitUI(x, y);
  if (i >= 0) { UIfocus = i; activate(i); return; }
  if (inFlight()) flap();
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const [x, y] = toGame(e), i = hitUI(x, y);
  if (i >= 0 && i !== UIfocus && !UI[i].disabled) UIfocus = i;
});

function toggleFullscreen() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) { /* not allowed here */ }
}

window.addEventListener('keydown', e => {
  const k = e.code;
  const action = k === 'Space' || k === 'Enter' || k === 'ArrowUp' || k === 'KeyW';
  if (action || k.startsWith('Arrow')) e.preventDefault();
  Snd.init();
  if (k === 'KeyF') return toggleFullscreen();
  if (k === 'KeyM') { save.settings.music = !save.settings.music; persist(); Snd.apply(); return; }
  if (k === 'Escape' || k === 'KeyP') {
    if (scr === 'game') togglePause(); else if (k === 'Escape') back();
    return;
  }
  if (inFlight()) {
    if (action && !e.repeat) flap();
    return;
  }
  if (scr === 'game' && !overlayUp()) return; // dying or arriving: wait for the panel
  if (k === 'ArrowLeft') navigate(-1, 0);
  else if (k === 'ArrowRight') navigate(1, 0);
  else if (k === 'ArrowUp') navigate(0, -1);
  else if (k === 'ArrowDown') navigate(0, 1);
  else if ((k === 'Space' || k === 'Enter') && !e.repeat) activate(UIfocus);
  else if (k === 'Backspace') back();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && scr === 'game' && S.phase === 'playing') paused = true;
});

// ---------- boot ----------
// #shot=<what>:<frames> renders one scene for store screenshots: title, campaign, manual, settings, or a level number.
function bootShot(spec) {
  const [what, n] = spec.split(':'), frames = parseInt(n, 10) || 0;
  // an example save, in memory only, so menus show a game in progress
  save.unlocked = LAST_LEVEL;
  for (let i = 0; i < save.unlocked; i++) save.stars[i] = 1 + (i * 7) % 3;
  if (/^\d+$/.test(what)) {
    startCampaign(parseInt(what, 10));
    S.autopilot = true; S.phase = 'playing';
    for (let i = 0; i < frames && S.phase === 'playing'; i++) updateRun();
  } else if (what === 'endless') {
    startEndless(false); S.autopilot = true; S.phase = 'playing';
    for (let i = 0; i < frames && S.phase === 'playing'; i++) updateRun();
  } else {
    go(what);
    if (what === 'campaign' && n) pickCh = parseInt(n, 10);
    for (let i = 0; i < frames; i++) { T++; updateRun(); }
  }
  T = 64; frozen = true;
}

resize();
requestAnimationFrame(frame);
const fontsReady = document.fonts
  ? Promise.race([
      Promise.all([document.fonts.load('20px "Press Start 2P"'), document.fonts.load('800 16px "JetBrains Mono"'), document.fonts.load('500 16px "JetBrains Mono"')]),
      new Promise(r => setTimeout(r, 2500)),
    ]).catch(() => {})
  : Promise.resolve();
Promise.all([loadImages(), fontsReady]).then(() => {
  const m = location.hash.match(/^#shot=(.+)$/);
  if (m) bootShot(decodeURIComponent(m[1]));
  else go('title');
});

</script>
